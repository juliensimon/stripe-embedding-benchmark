[project]
name = "stripe-docs-embedding-benchmark"
version = "0.1.0"
description = "Does paid embedding beat a free 0.6B model on the Stripe docs? Questions, scoring and a local demo."
requires-python = ">=3.11"
# Pinned to the versions the 2026-10-21 numbers were measured with. mlx-embeddings needs Apple silicon.
dependencies = [
    "numpy",
    "sentence-transformers==6.2.0",
    "mlx-embeddings==0.1.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "openai>=1.0",
]

[tool.uv]
package = false
